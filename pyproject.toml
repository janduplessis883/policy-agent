[project]
name = "nathan-policy-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.50,<2",
    "openai>=2,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "tiktoken>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
